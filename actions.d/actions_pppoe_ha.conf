# actions_pppoe_ha.conf
#
# configd service hooks for the OPNsense PPPoE HA patch engine.
#
# Scope : pppoe_ha   -> invoke as: configctl pppoe_ha <action>
# Deploy: /usr/local/opnsense/service/conf/actions.d/actions_pppoe_ha.conf
# Apply : service configd restart

[apply]
command:/usr/local/opnsense/scripts/pppoe_ha_patch.php apply
parameters:
type:script_output
message:Applying OPNsense PPPoE HA patch
description:Apply gateway switching, outbound NAT override and HA dialup sync for PPPoE HA

[verify]
command:/usr/local/opnsense/scripts/pppoe_ha_patch.php verify
parameters:
type:script_output
message:Verifying OPNsense PPPoE HA patch
description:Report the current state of the PPPoE HA patch on this node
cache_ttl:5

[revert]
command:/usr/local/opnsense/scripts/pppoe_ha_patch.php revert
parameters:
type:script_output
message:Reverting OPNsense PPPoE HA patch
description:Remove the outbound NAT override rule and the Internal_Networks alias

[reload]
command:/usr/local/etc/rc.filter_configure
parameters:
type:script
message:Reloading filter
description:Reload the pf filter (regenerate ruleset incl. NAT) after applying the patch
